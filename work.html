<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>All Work | Muhammad Anus</title>
<meta name="description" content="97+ live WordPress websites built by Muhammad Anus.">
<link rel="icon" href="assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--soft:#111113;--card:#18181b;--text:#f2f2f3;--muted:#a1a1aa;--line:#2a2a2f;--accent:#f5c518;--accent-dk:#ffd84d;--on-accent:#111}
html{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;font-size:16px}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-dk)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:rgba(11,11,12,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:700;color:var(--text);font-size:18px}.logo span{color:var(--accent)}
nav a{color:var(--muted);margin-left:22px;font-size:15px}nav a:hover{color:var(--accent)}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);padding:11px 22px;border-radius:6px;font-weight:600;font-size:15px}
.btn:hover{background:var(--accent-dk);color:var(--on-accent)}.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}.btn.ghost:hover{background:var(--accent);color:var(--on-accent)}
.hero{padding:80px 0 70px}.hero small{color:var(--accent);font-weight:600;letter-spacing:.5px}
.hero h1{font-size:44px;line-height:1.2;margin:12px 0 18px;max-width:760px}
.hero p{color:var(--muted);font-size:18px;max-width:640px;margin-bottom:28px}.hero .btn{margin-right:10px;margin-bottom:10px}
.stats{display:flex;gap:40px;margin-top:44px;flex-wrap:wrap}.stats b{display:block;font-size:28px}.stats span{color:var(--muted);font-size:14px}
section{padding:70px 0}section.soft{background:var(--soft)}
h2{font-size:30px;margin-bottom:10px}.lead{color:var(--muted);margin-bottom:34px;max-width:640px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}.box h3{font-size:18px;margin-bottom:8px}.box p{color:var(--muted);font-size:15px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.filters button{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:20px;cursor:pointer;font:inherit;font-size:14px;color:var(--text)}
.filters button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:26px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);color:var(--text);display:block;transition:box-shadow .2s}
.card:hover{border-color:var(--accent);color:var(--text)}
.shot{aspect-ratio:16/10;background:var(--soft) center top/cover no-repeat;border-bottom:1px solid var(--line)}
.card .in{padding:18px}.card .cat{font-size:13px;color:var(--accent);font-weight:600}.card h3{font-size:18px;margin:4px 0 6px}.card p{font-size:14px;color:var(--muted)}
.more{columns:3 220px;font-size:14px}.more a{display:block;color:var(--muted);padding:3px 0}.more a:hover{color:var(--accent)}
.tl div{border-left:2px solid var(--accent);padding:0 0 24px 18px}.tl b{display:block}.tl span{color:var(--muted);font-size:14px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.cs-head{padding:56px 0 30px}.back{font-size:14px}.cs-head h1{font-size:38px;margin:12px 0 10px}.cs-head p{color:var(--muted);font-size:18px;max-width:720px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:30px 0}
.meta div{background:var(--soft);border-radius:8px;padding:14px 16px}.meta small{color:var(--muted);display:block;font-size:13px}
.bigshot{width:100%;min-height:200px;background:#18181b;border:1px solid var(--line);border-radius:10px;display:block}
.cs-body{display:grid;grid-template-columns:2fr 1fr;gap:44px;padding:50px 0}
.cs-body h2{font-size:22px;margin:0 0 12px}.cs-body ul{padding-left:20px;margin-bottom:30px}.cs-body li{margin-bottom:6px}.cs-body p{margin-bottom:30px}
.steps{counter-reset:s;list-style:none;padding:0!important}.steps li{counter-increment:s;padding-left:38px;position:relative;margin-bottom:14px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;display:flex;align-items:center;justify-content:center}
aside .box{position:sticky;top:90px}aside .chips{margin:10px 0 20px}
@media(max-width:760px){.hero h1{font-size:32px}nav a:not(.btn){display:none}.cs-body{grid-template-columns:1fr}.cs-head h1{font-size:30px}}

section[id]{scroll-margin-top:70px}
.hero .stats{gap:26px}
.herogrid{display:grid;grid-template-columns:1.35fr 1fr;gap:40px;align-items:center}
.heroimg{position:relative;text-align:center}
.heroimg:before{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:88%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(245,197,24,.28),rgba(245,197,24,0) 70%)}
.heroimg img{position:relative;max-width:100%;height:auto;max-height:560px;width:auto}
.hero{padding:50px 0 40px}.hero h1 em{font-style:normal;color:var(--accent)}
.aboutimg{width:180px;height:auto;float:right;margin:0 0 12px 20px}
h2:after{content:"";display:block;width:48px;height:3px;background:var(--accent);margin-top:10px}
.cat{color:var(--accent)!important}
.shot{background-color:#222!important}
@media(max-width:860px){.herogrid{grid-template-columns:1fr}.heroimg img{max-height:380px}.aboutimg{width:130px}}
.two{display:grid;grid-template-columns:3fr 2fr;gap:44px;align-items:start}.two p{color:var(--muted);margin-bottom:16px}
.ticks{list-style:none;margin:6px 0 14px}.ticks li{padding:5px 0 5px 26px;position:relative;font-size:15px}
.ticks li:before{content:"\2713";position:absolute;left:0;color:var(--accent);font-weight:700}
.prob{color:var(--text);display:block}.prob span{font-size:14px;color:var(--accent);font-weight:600;display:block;margin-top:12px}
.prob:hover{border-color:var(--accent);color:var(--text)}
.three{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.steps4 b{color:var(--accent);font-size:14px}
.tl ul{margin:8px 0 0 18px;color:var(--muted);font-size:15px}.tl li{margin-bottom:3px}
.tag{display:inline-block;background:rgba(245,197,24,.15);color:var(--accent);font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.toolbar input{background:var(--card);color:var(--text);flex:1;max-width:380px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;font:inherit}
.toolbar span{color:var(--muted);font-size:14px}
.card .in p{word-break:break-all}
.pager{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:36px}
.pager button{min-width:40px;padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font:inherit;font-size:14px;color:var(--text)}
.pager button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.pager button:disabled{opacity:.4;cursor:default}
.pager span{padding:8px 4px;color:var(--muted)}
@media(max-width:760px){.two{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap"><a class="logo" href="index.html"><img src="assets/logo.png" alt="Muhammad Anus" width="180" height="25"></a>
<nav><a href="index.html#about">About</a><a href="index.html#skills">Skills</a><a href="index.html#work">Work</a><a href="work.html">All Work</a><a href="index.html#experience">Experience</a><a class="btn" href="index.html#contact">Hire Me</a></nav></div></header>

<div class="wrap cs-head" style="padding-bottom:10px"><a class="back" href="index.html">&larr; Back to home</a>
<h1>All Work</h1><p>97 live websites I've built, newest first, each with its own case study. Pick an industry or search by name.</p></div>
<section style="padding-top:20px"><div class="wrap">
<div class="filters" id="cats"></div>
<div class="toolbar"><input id="q" type="search" placeholder="Search by website name..."><span id="count"></span></div>
<div class="grid" id="all"></div>
<nav class="pager" id="pager" aria-label="Pagination"></nav>
</div></section>
<script src="sites.js"></script>
<script>
(function(){
var PER=12, list=SITES, page=1, cat='All', cats=document.getElementById('cats'), grid=document.getElementById('all'), pager=document.getElementById('pager'), q=document.getElementById('q'), count=document.getElementById('count');
function shot(u){return 'https://s.wordpress.com/mshots/v1/'+encodeURIComponent(u)+'?w=800';}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function render(){
  var pages=Math.max(1,Math.ceil(list.length/PER)); if(page>pages)page=pages;
  var items=list.slice((page-1)*PER,page*PER);
  grid.innerHTML=items.map(function(s){
    var url='https://'+s.d+'/', href=s.cs?('work/'+s.cs+'.html'):url, ext=s.cs?'':' target="_blank" rel="noopener"';
    return '<a class="card" href="'+href+'"'+ext+'><div class="shot" style="background-image:url(\''+shot(url)+'\')"></div><div class="in">'+'<div class="cat">'+esc(s.c)+(s.p?' &middot; '+esc(s.p):'')+(s.cs?' &middot; <span class="tag">Case Study</span>':'')+'</div>'+'<h3>'+esc(s.n||s.d)+'</h3><p>'+esc(s.d)+'</p></div></a>';
  }).join('') || '<p>No websites match your search.</p>';
  count.textContent=list.length+' websites';
  var h='<button '+(page==1?'disabled':'')+' data-p="'+(page-1)+'">&larr; Prev</button>';
  for(var i=1;i<=pages;i++){ if(i==1||i==pages||Math.abs(i-page)<=2) h+='<button class="'+(i==page?'on':'')+'" data-p="'+i+'">'+i+'</button>'; else if(Math.abs(i-page)==3) h+='<span>&hellip;</span>'; }
  h+='<button '+(page==pages?'disabled':'')+' data-p="'+(page+1)+'">Next &rarr;</button>';
  pager.innerHTML=pages>1?h:'';
}
pager.onclick=function(e){var p=e.target.getAttribute('data-p'); if(!p||e.target.disabled)return; page=+p; render(); history.replaceState(null,'','#page='+page); document.getElementById('q').scrollIntoView({behavior:'smooth',block:'start'});};
function apply(){var v=q.value.toLowerCase().trim(); list=SITES.filter(function(s){return (cat=='All'||s.c==cat||s.p==cat)&&(s.d+' '+(s.n||'')).toLowerCase().indexOf(v)>-1;}); page=1; render();}
q.oninput=apply;
var counts={}; SITES.forEach(function(s){counts[s.c]=(counts[s.c]||0)+1; if(s.p)counts[s.p]=(counts[s.p]||0)+1;});
var names=Object.keys(counts).sort(function(a,b){return a=='Other'?1:b=='Other'?-1:counts[b]-counts[a];});
cats.innerHTML='<button class="on" data-c="All">All ('+SITES.length+')</button>'+names.map(function(n){return '<button data-c="'+esc(n)+'">'+esc(n)+' ('+counts[n]+')</button>';}).join('');
cats.onclick=function(e){var c=e.target.getAttribute('data-c'); if(!c)return; cat=c; [].forEach.call(cats.children,function(b){b.classList.toggle('on',b===e.target);}); apply();};
var hc=location.hash.match(/cat=([^&]+)/); if(hc){var want=decodeURIComponent(hc[1]); [].forEach.call(cats.children,function(b){if(b.getAttribute('data-c')==want){cat=want; b.click();}});}
var m=location.hash.match(/page=(\d+)/); if(m)page=+m[1];
render();
})();
</script>
